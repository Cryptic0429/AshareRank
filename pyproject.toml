[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asharerank"
version = "0.1.0"
description = "Reproducible A-share cross-sectional equity research workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "pydantic>=2.6",
  "joblib>=1.3",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
data = ["tushare>=1.4.0", "akshare>=1.18"]
tree = ["lightgbm>=4.0", "xgboost>=2.0"]
deep = ["torch>=2.2"]
dev = ["pytest>=8.0"]
full = ["tushare>=1.4.0", "akshare>=1.18", "lightgbm>=4.0", "xgboost>=2.0", "torch>=2.2", "pytest>=8.0"]

[project.scripts]
asharerank = "asharerank.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/research"]
python_files = ["test_*.py"]
